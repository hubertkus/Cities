name: Build Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # id-token: write  # required to use OIDC authentication
  contents: write  # required to checkout the code from the repo and to perform release
  packages: write  # required to publish to packages

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      REPOSITORY: ${{ github.repository }}
      IMAGE_NAME: myapp

    steps:
    - name: Get code from repository
      uses: actions/checkout@v4

    - name: Change string case
      id: string
      uses: ASzc/change-string-case-action@v1
      with:
        string: ${{ env.REPOSITORY }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v2.9.0

    - name: Extract short SHA
      run: echo "SHORT_SHA=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

    - name: Log into Git Hub
      uses: docker/login-action@v3.1.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Read metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase }}
        tags: |
          type=raw,value=latest
          type=sha
          type=sha,format=long
          type=semver,pattern={{version}},value=${{ inputs.release_tag || 'latest' }}

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        builder: ${{ steps.buildx.outputs.name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # Skan plików projektu (zależności)
    - name: Trivy FS scan (project dependencies)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: table
        ignore-unfixed: true
        vuln-type: 'library'

    # Skan obrazu Docker
    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: 'table'
        ignore-unfixed: true
        vuln-type: 'os,library'
        exit-code: 0
      env:
        TRIVY_USERNAME: ${{ github.actor }}
        TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    # Generowanie SBOM
    - name: Generate SBOM
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: spdx-json
        output: sbom-${{ inputs.release_tag || 'latest' }}.json

    # Skanowanie SBOM
    - name: Install Grype
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Scan SBOM with Grype
      run: |
        grype sbom-${{ inputs.release_tag || 'latest' }}.json -o sarif > grype-results-${{ inputs.release_tag || 'latest' }}.sarif || true

    # Wysłanie SBOM i Grype do GitHub Release
    # - name: Upload SBOM to GitHub Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     tag_name: ${{ inputs.release_tag || 'latest' }}
    #     name: Sbom ${{ inputs.release_tag || 'latest' }}
    #     files: |
    #       sbom-${{ inputs.release_tag || 'latest' }}.json
    #       grype-results-${{ inputs.release_tag || 'latest' }}.sarif
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        builder: ${{ steps.buildx.outputs.name }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Confirm image was push
      run: |
         echo "✅ Image push assumed successful if previous step didn't fail"
