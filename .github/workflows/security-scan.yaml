name: site-security-scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: "https://cities.bieda.it/"
        allow_issue_writing: true
        artifact_name: "zap-report"
        cmd_options: "-a -r ZAP-Report.html"
    - name: List files in /zap/wrk/
      run: ls -la /zap/wrk/
    - name: Copy ZAP Report from container to workspace
      run: |
        cp /zap/wrk/ZAP-Report.html .
    - name: Upload ZAP HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: ZAP-Report.html