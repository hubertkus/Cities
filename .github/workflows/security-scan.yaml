name: site-security-scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: "https://cities.bieda.it/"
        allow_issue_writing: true
        artifact_name: "zap-report"
        cmd_options: "-a -J report_json.json -r report_html.html"
    - name: List files in /zap/wrk/
      run: ls -la /zap/wrk/
    # - name: Copy ZAP Report from container to workspace
    #   run: |
    #     cp /zap/wrk/report_html.html .
    #     cp /zap/wrk/report_json.json .
    - name: Upload ZAP HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: |
          report_html.html
          report_json.json